# GENERAL PARAMS
EXPERIMENT_NAME: "swin2_gated_bce_"
SEED: 0
DATASET_DIR: "../SwinCVS/endoscapes"
ANNOTATIONS_PATH: "./config/reformatted_annotations_frames.json"
CHECKPOINT_DIR: './weights'

# SWINV2 ENCODER PARAMS
MODEL:
  ENCODER:
    NAME: "swinv2_base_window12to24_192to384.ms_in22k_ft_in1k" #Param: 87.9M, Activ: 280.4M
    FROZEN_STAGES: 2
    DROP_PATH_RATE: 0.1
    FT_WEIGHTS: "weights/swinv2_base_window12to24_192to384.ms_in22k_ft_in1k_ft_ENDS.pt"
  TEMPORAL:
    NAME: 'gated_pooling'
    TEMPORAL_DROPOUT: 0.2
  CLASSIFIER:
    FC_DROPOUT: 0.5

DATA:
  DATASET_NAME: "ENDOSCAPES"
  TEMPORAL: True
  LABEL_CRITERION: null
  LABEL_METHOD: 'soft'

  DATASETS:
    ENDOSCAPES:
      MEAN: [0.485, 0.456, 0.406]
      STD: [0.229, 0.224, 0.225]
      CENTER_CROP: 480
      RESIZE: 384
      CLASS_WEIGHTS: [3.19852941, 4.46153846, 2.79518072]
    CVS_CHALLENGE:
      MEAN: [0, 0, 0]
      STD: [0, 0, 0]
      CENTER_CROP: 0
      RESIZE: 0
    CHOLEC80:
      MEAN: [0, 0, 0]
      STD: [0, 0, 0]
      CENTER_CROP: 0
      RESIZE: 0

# TRAINING PARAMS
TRAIN:
  EPOCHS: 15
  BATCH_SIZE: 4
  GRADIENT_ACC_BATCH_SIZE: 32
  EARLY_PATIENCE: 3
  OPTIMIZER:
    NAME: 'adamw'
    EPS: 1.0e-08
    BETAS: [0.9, 0.999]
    WEIGHT_DECAY: 0.05
  LOSS: 'bce'
  BBL_PARAMS:
    WEIGHTS:
      C1: [3.1985, 0.5926]     # C1: (1, 1)
      C2: [4.4615, 0.5631]     # C2: (1, 1)
      C3: [2.7952, 0.6089]     # C3: (1, 1)
    USE_KL: True
    PRIOR_ALPHA:
      NU: 2
      PI_C1: 0.1563
      PI_C2: 0.1121
      PI_C3: 0.1789
  WARMUP_EPOCHS: 1
  TEMPORAL_LR:
    TARGET: 0.0001
    END: 0.00001
  CLASSIFIER_LR:
    TARGET: 0.0001
    END: 0.00001 # This is essentially irrelevant because cosine_scheduler forces it to reduce to 1e-6 anyway
