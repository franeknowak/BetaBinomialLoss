# GENERAL PARAMS
EXPERIMENT_NAME: "SwinV2_encoder_pretraining_b_"
SEED: 0
DATASET_DIR: "../SwinCVS/endoscapes"
ANNOTATIONS_PATH: "./config/reformatted_annotations_frames.json"
CHECKPOINT_DIR: './weights'

# SWINV2 ENCODER PARAMS
ENCODER:
  NAME: "swinv2_base_window12to16_192to256.ms_in22k_ft_in1k" #Param: 87.9M, Activ: 84.7M
  FROZEN_STAGES: 0

DATA:
  DATASET_NAME: "ENDOSCAPES"
  TEMPORAL: False
  LABEL_CRITERION: null
  LABEL_METHOD: 'hard'

  DATASETS:
    ENDOSCAPES:
      MEAN: [0.485, 0.456, 0.406]
      STD: [0.229, 0.224, 0.225]
      CENTER_CROP: 480
      RESIZE: 256
      CLASS_WEIGHTS: [3.19852941, 4.46153846, 2.79518072]
    CVS_CHALLENGE:
      MEAN: [0, 0, 0]
      STD: [0, 0, 0]
      CENTER_CROP: 0
      RESIZE: 0
    CHOLEC80:
      MEAN: [0, 0, 0]
      STD: [0, 0, 0]
      CENTER_CROP: 0
      RESIZE: 0

# TRAINING PARAMS
TRAIN:
  EPOCHS: 10
  BATCH_SIZE: 4
  GRADIENT_ACC_BATCH_SIZE: 32
  EARLY_PATIENCE: 3
  OPTIMIZER:
    NAME: 'adamw'
    EPS: 1.0e-08
    BETAS: [0.9, 0.999]
    WEIGHT_DECAY: 0.02
    ENCODER_LR: 0.0001
    CLASSIFIER_LR: 0.0001
